[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smfs-inference"
version = "0.1.0"
description = "Tools for analyzing allele mutation data and estimating site frequency spectrum models"
authors = [{ name = "Deepjoyti Ghosh" }, { name = "Kyle Williams" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib"
]

[tool.setuptools]
packages = ["smfs"]
package-dir = {"" = "src"}

[project.optional-dependencies]
dev = ["black", "flake8", "pytest"]
