# Copy this file and edit paths/settings for your environment.
# Example:
#   cp configs/template.toml configs/my_analysis.toml
#   python smfs/estimate_xi_poisson.py --config configs/my_analysis.toml

[smfs.match_sfs_to_mutation_rates]
sfs_file = "data/site_frequency_spectrum.csv.gz"
mutation_rate_file = "data/mutation_rates.tsv"
output_file = "results/matched_site_frequency_spectrum.csv.gz"
save_output = true

[smfs.estimate_xi_poisson]
input_dir = "results"
input_file = "simulation_sites_with_observed_counts.csv.gz"
output_dir = "results"
output_xi_file = "xi_poisson.csv"
initial_xi = 1000.0
unique_mutation_limit = 300
output_unique_mutation_file = "expected_unique_mutation_sites_poisson_300.csv"

[smfs.estimate_xi_negative_binomial]
input_dir = "data"
input_file = "observed_site_frequency_spectrum.csv.gz"
output_dir = "results"
output_xi_file = "xi_negative_binomial.csv"
save_xi_output = false
initial_xi = 1000.0
unique_mutation_limit = 300
output_unique_mutation_file = "expected_unique_mutation_sites_negative_binomial_300.csv"

[smfs.estimate_smfs_from_unique_mutations]
input_dir = "data"
input_file = "observed_allele_counts.csv.gz"
unique_mutation_sites_dir = "results"
unique_mutation_sites_file = "expected_unique_mutation_sites_negative_binomial_300.csv"
output_dir = "results"
ac_limit = 300
output_file = "smfs_observed_300.csv"
apply_error_correction = false
error_file = "data/mutation_rates.tsv"

[population_model.sample_site_mutation_rates]
input_file = "data/mutation_rates.tsv"
expanded_output_file = "results/sampled_site_mutation_rates.csv"
diagnostic_output_file = "results/mutation_rate_sampling_diagnostics.csv"
diagnostic_sample_size = 100000
show_diagnostic_plots = false
write_diagnostic_output = true

[population_model.simulate_population_growth_mutations]
input_dir = "results"
input_file = "sampled_site_mutation_rates.csv"
output_dir = "results"
output_file = "simulated_mutations.csv"
mutation_rate_output_file = "simulated_site_mutation_rates.csv"
initial_population = 10000
final_population = 100000000
time_scale_multiplier = 250

[population_model.sample_observed_mutations]
input_dir = "results"
input_file = "simulated_mutations.csv"
output_dir = "results/sampled_data"
output_file = "sampled_observed_mutations.csv.gz"
final_population = 200000000
sample_size = 1000000

[population_model.summarize_derived_alleles_by_site]
input_dir = "results/sampled_data"
input_file = "sampled_observed_mutations.csv.gz"
output_dir = "results/sampled_data"
output_file = "observed_mutations_by_site.csv.gz"

[population_model.fill_missing_simulation_sites]
derived_allele_dir = "results/sampled_data"
derived_allele_file = "observed_mutations_by_site.csv.gz"
mutation_rate_dir = "results"
mutation_rate_file = "simulated_site_mutation_rates.csv"
output_dir = "results"
output_file = "simulation_sites_with_observed_counts.csv.gz"

[population_model.estimate_simulated_smfs_from_unique_mutations]
input_dir = "results"
input_file = "simulation_sites_with_observed_counts.csv.gz"
unique_mutation_sites_dir = "results"
unique_mutation_sites_file = "expected_unique_mutation_sites_poisson_300.csv"
output_dir = "results"
ac_limit = 300
output_file = "smfs_simulated_300.csv"
