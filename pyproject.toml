[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smfs-inference"
version = "1.0.0"
description = "Tools for analyzing allele mutation data and estimating site frequency spectrum models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Deepjoyti Ghosh" }, { name = "Kyle Williams" }]
keywords = [
    "population genetics",
    "site frequency spectrum",
    "mutation rate",
    "recurrent mutation",
    "simulation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "tomli; python_version < '3.11'"
]


[project.optional-dependencies]
dev = ["black", "flake8", "pytest"]

[project.urls]
Repository = "https://github.com/Deepgh/smfs-inference"
Issues = "https://github.com/Deepgh/smfs-inference/issues"
